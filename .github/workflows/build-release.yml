name: Build and Release

on:
  push:
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CMAKE_CONFIGURE: "cmake -Bbuild -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=OFF"

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate workflow YAML
        run: |
          python -c "import yaml; yaml.safe_load(open('.github/workflows/build-release.yml'))"
          echo "YAML valid"

      - name: Check CMakeLists exists
        run: |
          test -f CMakeLists.txt || (echo "CMakeLists.txt missing" && exit 1)
          echo "CMakeLists.txt found"

      - name: Check for debug remnants
        run: |
          if grep -r "TODO\|FIXME\|HACK\|XXX" --include="*.cpp" --include="*.h" src/ | grep -v "SPDX\|Copyright\|License"; then
            echo "Warning: debug markers found"
          else
            echo "No debug markers"
          fi

      - name: Check version consistency
        run: |
          VERSION=$(grep -m1 "AETHER_VERSION_MAJOR\|AETHER_VERSION_MINOR\|AETHER_VERSION_PATCH" CMakeLists.txt | head -3)
          echo "Version in CMakeLists.txt:"
          grep "AETHER_VERSION" CMakeLists.txt | head -4

      - name: Check no original branding
        run: |
          if grep -ri "deskflow\|synergy\|barrier" --include="*.cpp" --include="*.h" --include="*.ui" --include="*.xml" --include="*.desktop" --include="*.metainfo" src/ deploy/ 2>/dev/null | grep -v "Copyright\|SPDX\|License\|protocol\|Protocol\|kSynergy\|kBarrier\|SynergyProtocol\|BarrierProtocol\|NetworkProtocol\|Synergy App\|Symless\|Bolton\|Schoeneman\|Rizzitello"; then
            echo "Warning: possible original branding found"
          else
            echo "No original branding found"
          fi

  build-windows:
    name: Windows x64
    needs: verify
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup MSVC
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: amd64
          spectre: true

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        env:
          AQT_CONFIG: ${{ github.workspace }}/.github/actions/install-dependencies/aqt.ini
        with:
          version: "6.11.2"
          cache: true
          cache-key-prefix: windows-6.11.2
          aqtsource: git+https://github.com/miurahr/aqtinstall.git@16db45a70b5905ad596941b223469bc86a56901e

      - name: Build vcpkg (OpenSSL)
        id: vcpkg
        uses: johnwason/vcpkg-action@v8
        with:
          pkgs: openssl
          extra-args: --classic --host-triplet=x64-windows-release
          triplet: x64-windows-release
          token: ${{ github.token }}
          revision: 2025.09.17
          cache-key: openssl-x64-windows-release

      - name: Cache WiX
        uses: actions/cache@v4
        with:
          path: ~/.dotnet/tools
          key: wix-5.0.2

      - name: Install WiX
        run: |
          if ! command -v wix &>/dev/null; then
            dotnet tool install --global wix --version 5.0.2
          fi
          wix extension add --global WixToolset.UI.wixext/5.0.2 2>/dev/null || true
          wix extension add --global WixToolset.Util.wixext/5.0.2 2>/dev/null || true
          wix extension add --global WixToolset.Firewall.wixext/5.0.2 2>/dev/null || true
          wix extension add --global WixToolset.Bal.wixext/5.0.2 2>/dev/null || true
        shell: bash

      - name: Get version
        shell: bash
        run: |
          echo "PACKAGE_VERSION=$(echo $GITHUB_REF | sed 's,refs/tags/v,,g')" >> $GITHUB_ENV

      - name: Verify dependencies
        shell: bash
        run: |
          echo "Qt: $(qmake --version 2>&1 | head -1)"
          echo "CMake: $(cmake --version | head -1)"
          echo "Ninja: $(ninja --version 2>&1)"
          echo "WiX: $(wix --version 2>&1 || echo 'not found')"
          echo "OpenSSL: ${{ steps.vcpkg.outputs.vcpkg-cmake-config }}"

      - name: Configure
        run: ${{ env.CMAKE_CONFIGURE }} -G Ninja ${{ steps.vcpkg.outputs.vcpkg-cmake-config }} -DPACKAGE_VERSION_LABEL="${{ env.PACKAGE_VERSION }}"

      - name: Build
        run: cmake --build build --config Release -j8 --target package

      - name: Build EXE installer
        run: cmake --build build --config Release -j8 --target aether_exe_bootstrapper
        continue-on-error: true

      - name: Verify artifacts
        shell: bash
        run: |
          echo "Artifacts in build/:"
          ls -la build/aether-* 2>/dev/null || echo "No aether-* artifacts found"
          test -n "$(ls build/aether-*.msi 2>/dev/null)" && echo "MSI: OK" || echo "MSI: MISSING"
          test -n "$(ls build/aether-*.7z 2>/dev/null)" && echo "7z: OK" || echo "7z: MISSING"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: aether-windows-x64
          path: |
            ${{ github.workspace }}/build/aether-*.msi
            ${{ github.workspace }}/build/aether-*.exe
            ${{ github.workspace }}/build/aether-*.7z

  build-linux:
    name: Linux x64
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            git \
            ninja-build \
            pkg-config \
            libssl-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxkbregistry-dev \
            libxkbfile-dev \
            libxext-dev \
            libxi-dev \
            libxtst-dev \
            libxinerama-dev \
            libxrandr-dev \
            libgl1-mesa-dev \
            libegl-dev \
            libwayland-dev \
            libdbus-1-dev \
            libglib2.0-dev \
            libportal-dev \
            libei-dev

      - name: Verify system packages
        run: |
          echo "Checking required packages..."
          for pkg in build-essential cmake git ninja-build pkg-config libssl-dev libx11-dev libxkbcommon-dev libxkbregistry-dev libxkbfile-dev libxext-dev libxi-dev libxtst-dev libxinerama-dev libxrandr-dev libgl1-mesa-dev libegl-dev libwayland-dev libdbus-1-dev libglib2.0-dev libportal-dev libei-dev; do
            if dpkg -s "$pkg" >/dev/null 2>&1; then
              echo "  OK: $pkg"
            else
              echo "  MISSING: $pkg"
              exit 1
            fi
          done

      - name: Verify pkg-config modules
        run: |
          echo "Checking pkg-config modules..."
          for mod in openssl x11 xkbcommon xkbregistry xi xtst xinerama xrandr wayland-client dbus-1 glib-2.0 libportal libei-1.0; do
            if pkg-config --exists "$mod" 2>/dev/null; then
              echo "  OK: $mod ($(pkg-config --modversion $mod))"
            else
              echo "  MISSING: $mod"
              exit 1
            fi
          done

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          cache: true
          cache-key-prefix: linux-6.8.3

      - name: Get version
        shell: bash
        run: |
          echo "PACKAGE_VERSION=$(echo $GITHUB_REF | sed 's,refs/tags/v,,g')" >> $GITHUB_ENV

      - name: Verify Qt
        run: |
          echo "Qt: $(qmake --version 2>&1 | head -1)"
          echo "CMake: $(cmake --version | head -1)"
          echo "Ninja: $(ninja --version 2>&1)"

      - name: Configure
        run: |
          cmake -Bbuild -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTS=OFF \
            -G Ninja \
            -DPACKAGE_VERSION_LABEL="${{ env.PACKAGE_VERSION }}"

      - name: Build
        run: cmake --build build --config Release -j4 --target package

      - name: Verify artifacts
        run: |
          echo "Artifacts in build/:"
          ls -la build/aether-* 2>/dev/null || echo "No aether-* artifacts found"
          test -n "$(ls build/aether-*.deb 2>/dev/null)" && echo "DEB: OK" || echo "DEB: MISSING"
          test -n "$(ls build/aether-*.7z 2>/dev/null)" && echo "7z: OK" || echo "7z: MISSING"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: aether-linux-x64
          path: |
            ${{ github.workspace }}/build/aether-*.deb
            ${{ github.workspace }}/build/aether-*.rpm
            ${{ github.workspace }}/build/aether-*.tar.gz
            ${{ github.workspace }}/build/aether-*.7z

  release:
    name: Release
    needs: [build-windows, build-linux]
    if: contains(github.ref, '/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version
        shell: bash
        run: |
          echo "PACKAGE_VERSION=$(echo $GITHUB_REF | sed 's,refs/tags/v,,g')" >> $GITHUB_ENV

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: aether-windows-x64
          path: artifacts

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: aether-linux-x64
          path: artifacts

      - name: Verify all artifacts present
        shell: bash
        run: |
          echo "All artifacts:"
          ls -la artifacts/aether-*
          echo "---"
          echo "Windows MSI: $(ls artifacts/aether-*.msi 2>/dev/null | wc -l) file(s)"
          echo "Windows EXE: $(ls artifacts/aether-*.exe 2>/dev/null | wc -l) file(s)"
          echo "Linux DEB: $(ls artifacts/aether-*.deb 2>/dev/null | wc -l) file(s)"
          echo "7z: $(ls artifacts/aether-*.7z 2>/dev/null | wc -l) file(s)"
          if [ -z "$(ls artifacts/aether-*.msi 2>/dev/null)" ]; then
            echo "ERROR: Windows MSI missing"
            exit 1
          fi
          if [ -z "$(ls artifacts/aether-*.deb 2>/dev/null)" ]; then
            echo "ERROR: Linux DEB missing"
            exit 1
          fi

      - name: Generate checksums
        shell: bash
        run: |
          cd artifacts
          sha256sum aether-* > sums.txt
          cat sums.txt

      - name: Deploy release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ github.ref_name }}
          name: "Aether ${{ env.PACKAGE_VERSION }}"
          generate_release_notes: true
          make_latest: true
          prerelease: false
          files: |
            artifacts/aether-*
            artifacts/sums.txt

  notify:
    name: Notify Telegram
    needs: [build-windows, build-linux]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Send Telegram notification
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          WIN_RESULT: ${{ needs.build-windows.result }}
          LINUX_RESULT: ${{ needs.build-linux.result }}
          RELEASE_TAG: ${{ github.ref_name }}
          REPO_URL: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STARTED_AT: ${{ github.run_started_at }}
        run: |
          if [ -z "$TG_BOT_TOKEN" ] || [ -z "$TG_CHAT_ID" ]; then
            echo "Telegram secrets not set, skipping notification"
            exit 0
          fi

          # Status labels
          WIN_STATUS="unknown"
          case "$WIN_RESULT" in
            success) WIN_STATUS="passed" ;;
            failure) WIN_STATUS="failed" ;;
            skipped) WIN_STATUS="skipped" ;;
            cancelled) WIN_STATUS="cancelled" ;;
          esac

          LINUX_STATUS="unknown"
          case "$LINUX_RESULT" in
            success) LINUX_STATUS="passed" ;;
            failure) LINUX_STATUS="failed" ;;
            skipped) LINUX_STATUS="skipped" ;;
            cancelled) LINUX_STATUS="cancelled" ;;
          esac

          # Overall status
          if [ "$WIN_RESULT" = "success" ] && [ "$LINUX_RESULT" = "success" ]; then
            OVERALL="PASSED"
            HEADER_EMOJI="white_check_mark"
          else
            OVERALL="FAILED"
            HEADER_EMOJI="x"
          fi

          # Trigger type
          if [[ "$RELEASE_TAG" == v* ]]; then
            TRIGGER="Release"
            TRIGGER_VAL="<b>$RELEASE_TAG</b>"
          else
            TRIGGER="Branch"
            TRIGGER_VAL="<code>$RELEASE_TAG</code>"
          fi

          # Timestamps
          START_TIME=$(date -u -d "$JOB_STARTED_AT" "+%Y-%m-%d %H:%M:%S UTC" 2>/dev/null || echo "$JOB_STARTED_AT")
          END_TIME=$(date -u "+%Y-%m-%d %H:%M:%S UTC")
          DURATION_SEC=$(( $(date -u +%s) - $(date -u -d "$JOB_STARTED_AT" +%s 2>/dev/null || echo 0) ))
          DURATION_MIN=$(( DURATION_SEC / 60 ))
          DURATION_REM=$(( DURATION_SEC % 60 ))
          DURATION="${DURATION_MIN}m ${DURATION_REM}s"

          # Commit info
          COMMIT_SHA="${GITHUB_SHA:0:7}"
          COMMIT_URL="${{ github.server_url }}/${{ github.repository }}/commit/${GITHUB_SHA}"
          COMMIT_MSG=$(git log -1 --pretty=format:'%s' 2>/dev/null || echo "unknown")

          # Build HTML message
          read -r -d '' MESSAGE <<EOF
<b>Aether Build</b> :$HEADER_EMOJI:

<b>Status:</b> $OVERALL
<b>$TRIGGER:</b> $TRIGGER_VAL
<b>Commit:</b> <a href="$COMMIT_URL">$COMMIT_SHA</a> - $COMMIT_MSG

<b>Windows:</b> $WIN_STATUS
<b>Linux:</b> $LINUX_STATUS

<b>Started:</b> $START_TIME
<b>Completed:</b> $END_TIME
<b>Duration:</b> $DURATION

<a href="$RUN_URL">View run</a>
EOF

          curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TG_CHAT_ID}" \
            -d "text=${MESSAGE}" \
            -d "parse_mode=HTML" \
            -d "disable_web_page_preview=true"
