name: Build and Release

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PACKAGE_PREFIX: "AETHER"
  PACKAGE_PATH: ./dist
  CMAKE_CONFIGURE: "cmake -Bbuild -DCMAKE_BUILD_TYPE=Release -DSKIP_BUILD_TESTS=ON"

jobs:
  build-windows:
    name: Windows x64
    runs-on: windows-2022
    permissions:
      contents: write
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup MSVC
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: amd64
          spectre: true

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        env:
          AQT_CONFIG: ${{ github.workspace }}/.github/actions/install-dependencies/aqt.ini
        with:
          version: "6.11.2"
          cache: true
          cache-key-prefix: windows-6.11.2
          aqtsource: git+https://github.com/miurahr/aqtinstall.git@16db45a70b5905ad596941b223469bc86a56901e

      - name: Build vcpkg (OpenSSL)
        id: vcpkg
        uses: johnwason/vcpkg-action@v8
        with:
          pkgs: openssl
          extra-args: --classic --host-triplet=x64-windows-release
          triplet: x64-windows-release
          token: ${{ github.token }}
          revision: master

      - name: Install WiX
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add --global WixToolset.UI.wixext/5.0.2
          wix extension add --global WixToolset.Util.wixext/5.0.2
          wix extension add --global WixToolset.Firewall.wixext/5.0.2
        shell: pwsh

      - name: Get version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == *"tags/v"* ]]; then
            echo "PACKAGE_VERSION=$(echo $GITHUB_REF | sed 's,refs/tags/v,,g')" >> $GITHUB_ENV
          else
            echo "PACKAGE_VERSION=continuous" >> $GITHUB_ENV
          fi

      - name: Configure
        run: ${{ env.CMAKE_CONFIGURE }} -G Ninja ${{ steps.vcpkg.outputs.vcpkg-cmake-config }} -DPACKAGE_VERSION_LABEL="${{ env.PACKAGE_VERSION }}"

      - name: Build
        run: cmake --build build --config Release -j8 --target package

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AETHER-windows-x64
          path: ${{ github.workspace }}/build/AETHER[-_]*.*

  release:
    needs: build-windows
    if: (github.ref == 'refs/heads/main') || (contains(github.ref, '/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == *"tags/v"* ]]; then
            echo "PACKAGE_VERSION=$(echo $GITHUB_REF | sed 's,refs/tags/v,,g')" >> $GITHUB_ENV
          else
            echo "PACKAGE_VERSION=continuous" >> $GITHUB_ENV
          fi

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: AETHER-windows-x64
          path: artifacts

      - name: Generate checksums
        shell: bash
        run: |
          cd artifacts
          sha256sum AETHER-* > sums.txt
          cat sums.txt

      - name: Deploy continuous
        if: (github.ref == 'refs/heads/main') && !(contains(github.ref, '/tags/v'))
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: "continuous"
          name: "Continuous Build"
          prerelease: true
          generate_release_notes: false
          files: |
            artifacts/AETHER-*
            artifacts/sums.txt

      - name: Deploy release
        if: contains(github.ref, '/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ github.ref_name }}
          name: "Aether ${{ env.PACKAGE_VERSION }}"
          generate_release_notes: true
          make_latest: true
          prerelease: false
          files: |
            artifacts/AETHER-*
            artifacts/sums.txt
