<style>
.doc-content {
  max-width: 48rem;
  margin: 0 auto;
  padding: 48px 24px;
}
.doc-content h1 { font-size: 32px; margin-bottom: 24px; }
.doc-content h2 { font-size: 24px; margin-top: 32px; margin-bottom: 16px; }
.doc-content h3 { font-size: 20px; margin-top: 24px; margin-bottom: 12px; }
.doc-content h4 { font-size: 18px; margin-top: 16px; margin-bottom: 8px; }
.doc-content p { color: var(--text-secondary); margin-bottom: 16px; }
.doc-content ul, .doc-content ol { color: var(--text-secondary); padding-left: 24px; margin-bottom: 16px; }
.doc-content li { margin-bottom: 8px; }
.doc-content code { font-family: 'Fira Code', ui-monospace, monospace; background: var(--surface); padding: 2px 8px; border-radius: 4px; font-size: 0.875em; color: var(--text-secondary); }
.doc-content pre { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 16px; overflow-x: auto; margin-bottom: 16px; }
.doc-content pre code { background: none; padding: 0; }
.doc-content table { width: 100%; border-collapse: collapse; margin-bottom: 16px; }
.doc-content th, .doc-content td { border: 1px solid var(--border); padding: 8px 12px; text-align: left; }
.doc-content th { background: var(--surface); font-weight: 700; }
.doc-content td { color: var(--text-secondary); }
.doc-content a { color: var(--primary); }
.doc-content blockquote { border-left: 3px solid var(--border); padding-left: 16px; margin-bottom: 16px; color: var(--text-muted); }
.doc-content hr { border: none; border-top: 1px solid var(--border); margin: 24px 0; }
.doc-content img { max-width: 100%; border-radius: 8px; margin-bottom: 16px; }
.doc-back { display: inline-flex; align-items: center; gap: 8px; margin-bottom: 24px; font-size: 15px; font-weight: 500; color: var(--text-muted); }
.doc-back:hover { color: var(--text); opacity: 1; }
</style>

<div class="doc-content">
  <a href="docs.html" class="doc-back">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="15 18 9 12 15 6"/></svg>
    Back to docs
  </a>
  <div id="doc-render"></div>
</div>
<script>
fetch('HelpMain.md')
  .then(r => r.text())
  .then(md => {
    // fix internal .md links to .html
    md = md.replace(/Configuration\.md/g, 'configuration.html')
           .replace(/HelpMain\.md/g, 'helpmain.html')
           .replace(/Issues\.md/g, 'issues.html')
           .replace(/Security\.md/g, 'security.html')
           .replace(/dev\/build\.md/g, 'build.html')
           .replace(/build\.md/g, 'build.html')
           .replace(/dev\/protocol_reference\.md/g, 'protocol-reference.html')
           .replace(/protocol_reference\.md/g, 'protocol-reference.html')
           .replace(/Readme\.md/g, 'index.html');
    document.getElementById('doc-render').innerHTML = marked.parse(md);
  })
  .catch(() => {
    document.getElementById('doc-render').innerHTML = '<p style="color:var(--text-muted);">Failed to load document.</p>';
  });
</script>
