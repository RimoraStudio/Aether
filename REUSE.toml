version = 1
SPDX-PackageName = "aether"
SPDX-PackageSupplier = "Rimora Studio"
SPDX-PackageDownloadLocation = "https://github.com/RimoraStudio/Aether"

[[annotations]]
path = [
   ".github/**"
 , ".clang-format"
 , ".editorconfig"
 , ".gitattributes"
 , ".gitignore"
 , "cspell.json"
 , "sonar-project.properties"
 , "cmake/vcpkg.json.in"
 , "**/*.md"
 , "docs/**"
 , "deploy/linux/flatpak/**"
 , "deploy/linux/org.aether.aether.metainfo.xml"
 , "deploy/windows/wix-patch.xml.in"
 , "src/apps/aether-client/aether-client.exe.manifest"
 , "src/apps/aether-core/aether-core.exe.manifest"
 , "src/apps/aether-server/aether-server.exe.manifest"
 , "src/apps/res/manpage.txt"
 , "src/apps/res/aether.plist.in"
 , "src/apps/res/entitlements-dev.plist"
 , "translations/*.ts"
]
SPDX-FileCopyrightText = "Rimora Studio"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = [
   "deploy/mac/dmg-background.tiff"
 , "deploy/mac/dmg-volume.icns"
 , "deploy/linux/org.aether.aether.png"
 , "deploy/windows/wix-banner.png"
 , "deploy/windows/wix-dialog.png"
 , "src/apps/res/icons/aether-**/apps/64/aether*.svg"
 , "src/apps/res/image/welcome.png"
 , "src/apps/res/Aether.icns"
 , "src/apps/res/aether.ico"
 , "src/apps/res/aether.qrc"
]
SPDX-FileCopyrightText = "Rimora Studio"
SPDX-License-Identifier = "GPL-2.0-only"

[[annotations]]
path = "src/apps/res/icons/aether-**/**/**/**.svg"
SPDX-FileCopyrightText = "Kde Breeze Icons"
SPDX-License-Identifier = "LGPL-2.1-only"

[[annotations]]
path = "src/apps/res/icons/aether-**/index.theme"
SPDX-FileCopyrightText = "Chris Rizzitello <sithlord48@gmail.com>"
SPDX-License-Identifier = "LGPL-2.1-only"

[[annotations]]
path = [
   "src/lib/gui/MainWindow.ui"
 , "src/lib/gui/dialogs/*.ui"
]
SPDX-FileCopyrightText = "Rimora Studio"
SPDX-License-Identifier = "GPL-2.0-only WITH LicenseRef-OpenSSL-Exception"
